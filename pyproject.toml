[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "keepup"
version = "0.1.0"
description = "discrete-event simulator for postgres autovacuum: forecast bloat and wraparound, test settings before you ship them"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
pg = ["psycopg[binary]>=3.1"]
dev = [
    "psycopg[binary]>=3.1",
    "pytest>=8",
    "pytest-cov>=5",
    "hypothesis>=6.100",
    "ruff>=0.6",
    "mypy>=1.10",
]

[project.scripts]
keepup = "keepup.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/keepup"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "PL", "NPY"]
ignore = [
    "PLR0911", "PLR0912", "PLR0913", "PLR0915", "PLR2004",  # sim code has lots of branches and magic pg constants
    "RUF001", "RUF002", "RUF003",
    "PLW2901", "PLR0917", "PLR0914", "PLR6301", "PLC0415", "PLR1702",
    "SIM108",
]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
files = ["src/keepup"]

[[tool.mypy.overrides]]
module = ["matplotlib.*", "psycopg.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "pg: needs a running postgres (set KEEPUP_TEST_DSN)",
    "slow: takes more than a few seconds",
]
